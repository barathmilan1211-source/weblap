<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cader Studio | Creative Design</title>
    <style>
        /* Modern sötét téma */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 20px;
            max-width: 800px;
        }

        h1 {
            font-size: 3.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00dbde, #fc00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            color: #ccc;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 20px;
            border: 1px solid #444;
            border-radius: 50px;
            font-size: 0.9rem;
            color: #00ff88;
        }

        .footer {
            position: absolute;
            bottom: 30px;
            font-size: 0.8rem;
            color: #555;
        }

        /* Animáció a szövegnek */
        .fade-in {
            animation: fadeIn 2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container fade-in">
        <h1>CADER STUDIO</h1>
        <p>Digitális alkotóműhely és kreatív megoldások.</p>
        <p>A weboldalunk fejlesztés alatt áll, hamarosan új tartalmakkal jelentkezünk.</p>
        
        <div class="status">
            ● Hamarosan elérhető
        </div>
    </div>

    <div class="footer">
        © 2024 Cader Studio | caderx.publicvm.com
    </div>

</body>
</html>
